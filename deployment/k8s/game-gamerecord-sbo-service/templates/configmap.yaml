apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-sbo-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Warning"
          }
      },
      "GameRecordInfo": {
        "GameProviderCode": "SBOTF",
        "GameExternals": [
          {
            "Portfolio": "SportsBook",
            "GameExternalId": "sports_book"
          },
          {
            "Portfolio": "VirtualSports",
            "GameExternalId": "virtual_sports"
          }
        ],
        "IntervalMinutes": 5,
        "IntervalMinutesMax": 15,
        "IntervalMinutesMinimum": 3,
        "LockMinute": 3
      },
      "GameRecord": {
         "GameCommandClientBaseUrl": "http://game-gamecommand/",
         "GameInterfaceBaseUrl": "http://game-gameinterface-sbo-service:9090/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]